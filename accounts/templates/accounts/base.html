<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}VideoCreate AI Agent{% endblock %}</title>
</head>
<body>
    {% if messages %}
      <div id="django-messages" style="position:fixed;top:70px;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:0.5rem;max-width:360px;">
        {% for message in messages %}
          <div style="padding:0.75rem 1.1rem;border-radius:10px;font-size:0.84rem;font-weight:600;
            {% if message.tags == 'success' %}background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.35);color:#4ade80;
            {% elif message.tags == 'error' %}background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.35);color:#f87171;
            {% else %}background:rgba(99,55,255,0.15);border:1px solid rgba(99,55,255,0.35);color:#a78bfa;{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
      <script>
        setTimeout(function(){
          var el = document.getElementById('django-messages');
          if(el){ el.style.transition='opacity 0.5s'; el.style.opacity='0'; setTimeout(function(){el.remove();},500); }
        }, 3000);
      </script>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
