{% extends "admin_panel/base.html" %}

{% block title %}ダッシュボード{% endblock %}

{% block content %}
<div class="page-header">
  <h1>ダッシュボード</h1>
  <p>管理者向けコントロールパネル</p>
</div>

<div style="display: flex; gap: 20px; margin-bottom: 24px;">
  <a href="{% url 'admin_panel:user_list' %}" class="stat-card card" style="flex: 1; text-align: center; text-decoration: none; color: inherit; cursor: pointer; transition: box-shadow 0.15s, transform 0.15s;">
    <div style="font-size: 2.5rem; font-weight: bold; color: #2563eb;">{{ user_count }}</div>
    <div style="color: #666; margin-top: 4px;">登録ユーザー数</div>
    <div style="margin-top: 12px; font-size: 0.8rem; color: #2563eb;">ユーザー管理 →</div>
  </a>
  <a href="{% url 'admin_panel:provider_list' %}" class="stat-card card" style="flex: 1; text-align: center; text-decoration: none; color: inherit; cursor: pointer; transition: box-shadow 0.15s, transform 0.15s;">
    <div style="font-size: 2.5rem; font-weight: bold; color: #059669;">{{ provider_count }}</div>
    <div style="color: #666; margin-top: 4px;">AIプロバイダー数</div>
    <div style="margin-top: 12px; font-size: 0.8rem; color: #059669;">プロバイダー管理 →</div>
  </a>
  <a href="{% url 'admin_panel:validation_list' %}" class="stat-card card" style="flex: 1; text-align: center; text-decoration: none; color: inherit; cursor: pointer; transition: box-shadow 0.15s, transform 0.15s;">
    <div style="font-size: 2.5rem; font-weight: bold; color: #7c3aed;">{{ validation_count }}</div>
    <div style="color: #666; margin-top: 4px;">バリデーション設定数</div>
    <div style="margin-top: 12px; font-size: 0.8rem; color: #7c3aed;">バリデーション設定一覧 →</div>
  </a>
</div>

<div class="card">
  <h2 style="font-size: 1rem; margin-bottom: 16px;">クイックアクセス</h2>
  <div style="display: flex; gap: 12px; flex-wrap: wrap;">
    <a href="{% url 'admin_panel:user_create' %}" class="btn btn-primary">+ ユーザー追加</a>
    <a href="{% url 'admin_panel:provider_create' %}" class="btn btn-primary">+ プロバイダー追加</a>
  </div>
</div>

<style>
  .stat-card:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.13);
    transform: translateY(-2px);
  }
</style>
{% endblock %}
