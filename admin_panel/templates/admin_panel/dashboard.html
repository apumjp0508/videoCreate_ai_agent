{% extends "admin_panel/base.html" %}

{% block title %}ダッシュボード{% endblock %}

{% block content %}
<div class="page-header">
  <h1>ダッシュボード</h1>
  <p>管理者向けコントロールパネル</p>
</div>

<div style="display: flex; gap: 20px; margin-bottom: 24px;">
  <div class="card" style="flex: 1; text-align: center;">
    <div style="font-size: 2.5rem; font-weight: bold; color: #2563eb;">{{ user_count }}</div>
    <div style="color: #666; margin-top: 4px;">登録ユーザー数</div>
    <a href="{% url 'admin_panel:user_list' %}" class="btn btn-secondary btn-sm" style="margin-top: 12px;">ユーザー管理</a>
  </div>
  <div class="card" style="flex: 1; text-align: center;">
    <div style="font-size: 2.5rem; font-weight: bold; color: #059669;">{{ provider_count }}</div>
    <div style="color: #666; margin-top: 4px;">AIプロバイダー数</div>
    <a href="{% url 'admin_panel:provider_list' %}" class="btn btn-secondary btn-sm" style="margin-top: 12px;">プロバイダー管理</a>
  </div>
</div>

<div class="card">
  <h2 style="font-size: 1rem; margin-bottom: 16px;">クイックアクセス</h2>
  <div style="display: flex; gap: 12px; flex-wrap: wrap;">
    <a href="{% url 'admin_panel:user_create' %}" class="btn btn-primary">+ ユーザー追加</a>
    <a href="{% url 'admin_panel:provider_create' %}" class="btn btn-primary">+ プロバイダー追加</a>
  </div>
</div>
{% endblock %}
