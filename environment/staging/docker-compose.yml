name: videocreate_staging

services:
  # ─────────────────────────────────────────
  # アプリ DB (Django 用)
  # ─────────────────────────────────────────
  db:
    image: postgres:16
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────
  # Django Web サーバー
  # ─────────────────────────────────────────
  web:
    build:
      context: ../../
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../../:/app
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # ─────────────────────────────────────────
  # Temporal 専用 DB
  # ─────────────────────────────────────────
  temporal-db:
    image: postgres:16
    volumes:
      - temporal_postgres_data_staging:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_DB: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_DB_USER:-temporal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────
  # Temporal サーバー (auto-setup)
  # ─────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.25.2
    ports:
      - "7234:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: temporal-db
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal}
    depends_on:
      temporal-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────
  # Temporal UI
  # ─────────────────────────────────────────
  temporal-ui:
    image: temporalio/ui:2.31.2
    ports:
      - "8081:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8081
    depends_on:
      - temporal

  # ─────────────────────────────────────────
  # Temporal Worker (Django ベース)
  # ─────────────────────────────────────────
  temporal-worker:
    build:
      context: ../../
      dockerfile: Dockerfile
    command: python -m temporal.worker_pipeline
    volumes:
      - ../../:/app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      TEMPORAL_HOST: temporal:7233
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy

volumes:
  postgres_data_staging:
  temporal_postgres_data_staging:
